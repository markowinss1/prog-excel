[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-freelancer-toolkit"
version = "0.1.0"
description = "Local desktop toolkit for safe spreadsheet workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
